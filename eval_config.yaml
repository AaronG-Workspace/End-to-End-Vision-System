# Evaluation settings, hand-written before any model ran. Nothing here comes from test images.
# calibrate.py fills in only the null thresholds (from val), then freeze.py hashes this file.
backbone: resnet18          # wide_resnet50_2 is the PatchCore paper default: swap here
coreset_ratio: 0.1
min_auroc: 0.85
variants: [fp32, int8]
thresholds:                 # f1_optimal is the operating threshold; max_val_normal is the alternative estimator
  fp32: {f1_optimal: 1.629166841506958, max_val_normal: 1.2792223691940308}
  int8: {f1_optimal: 1.6646771430969238, max_val_normal: 1.3339486122131348}
eps_grid: [0, 0.005, 0.01, 0.015, 0.02, 0.03, 0.05]   # L-infinity on the 0 to 1 pixel scale (FGSM, random-sign noise)
pgd:
  eps: [0.005, 0.01, 0.02]
  steps: 10
  alpha_over_eps: 0.25      # alpha = eps / 4
  random_start: true
  restarts: 1               # 3 if time allows; decide before freeze.py
